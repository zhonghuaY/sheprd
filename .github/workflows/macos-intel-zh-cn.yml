name: macOS Intel (Simplified Chinese)

on:
  push:
    branches: [i18n/zh-cn]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'zhonghuaY/sheprd'
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.2'
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set build version
        run: printf 'HERDR_RELEASE_VERSION=%s.%s\n' "$(date -u +%Y%m%d)" "$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
      - name: Check translations and build
        run: |
          test "$(uname -m)" = x86_64
          rustup show
          python3 scripts/check-i18n.py
          cargo test --locked -p sheprd-i18n
          cargo build --locked --release -p sheprd-gpui -p sheprd-acp -p sheprd-remote-control -p sheprd-automate --target "$TARGET"
          bash scripts/release/build-nearby.sh "$TARGET"
          python3 scripts/release/fetch-herdr-core.py "$TARGET" "target/$TARGET/release"
      - name: Install the notice generator
        run: cargo install cargo-about --version '=0.9.2' --locked --features cli
      - name: Assemble and package the app
        run: |
          bin="target/$TARGET/release"
          python3 scripts/release/generate-notices.py "$bin/THIRD-PARTY-NOTICES.txt"
          mkdir -p dist "$RUNNER_TEMP/sheprd-dmg"
          app=$(bash scripts/release/package-macos.sh "$HERDR_RELEASE_VERSION" --x86_64 "$bin/sheprd" "$RUNNER_TEMP/sheprd-dmg" "$bin/THIRD-PARTY-NOTICES.txt")
          for executable in "$app/Contents/MacOS/"*; do
            if [[ ${executable##*/} != sheprd ]]; then
              codesign --sign - "$executable"
            fi
          done
          codesign --sign - --entitlements assets/macos/Sheprd.entitlements "$app"
          ln -s /Applications "$RUNNER_TEMP/sheprd-dmg/Applications"
          hdiutil create -format UDZO -fs HFS+ -volname 'Sheprd' -srcfolder "$RUNNER_TEMP/sheprd-dmg" dist/Sheprd-zh-CN-macos-x86_64.dmg
      - name: Verify the DMG and system language selection
        run: |
          dmg=dist/Sheprd-zh-CN-macos-x86_64.dmg
          hdiutil verify "$dmg"
          mount=$(mktemp -d "$RUNNER_TEMP/sheprd-mount.XXXXXX")
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          app="$mount/Sheprd.app"
          executable="$app/Contents/MacOS/sheprd"
          test "$(readlink "$mount/Applications")" = /Applications
          codesign --verify --deep --strict "$app"
          for binary in "$app/Contents/MacOS/"*; do
            test "$(lipo -archs "$binary")" = x86_64
          done
          plutil -lint "$app/Contents/Info.plist" "$app/Contents/Resources/zh-CN.lproj/InfoPlist.strings"
          python3 scripts/release/smoke-cli.py "$executable"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/sheprd-config" XDG_STATE_HOME="$RUNNER_TEMP/sheprd-state"
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_STATE_HOME"
          defaults write -g AppleLanguages -array zh-Hans-CN en-US
          "$executable" language list --json | jq -e 'any(.[]; .tag == "zh-CN" and .name == "简体中文")'
          "$executable" language status --json | jq -e '.configured == "system" and .locale == "zh-CN" and .running == false'
          "$executable" language set en-US
          "$executable" language status --json | jq -e '.configured == "en-US" and .locale == "en-US"'
          (cd dist && shasum -a 256 "${dmg##*/}" > "${dmg##*/}.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: Sheprd-zh-CN-macos-x86_64
          path: dist/Sheprd-zh-CN-macos-x86_64.dmg*
          if-no-files-found: error
          retention-days: 30
